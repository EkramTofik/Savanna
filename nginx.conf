server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable correct MIME types for modern web media
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        text/vtt                              vtt;
        video/mp4                             mp4;
        audio/ogg                             opus;
        audio/mpeg                            mp3;
        audio/wav                             wav;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
    }

    # Keep the local preview on one origin, matching the hosted Render setup.
    location /v1/ {
        proxy_pass http://api:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        proxy_pass http://api:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://api:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
        proxy_pass http://api:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Byte-range support for audio/video media streaming
    location / {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        try_files $uri $uri/ /index.html;
    }

    # Explicit routing for contracts fixtures
    location /media/ {
        alias /usr/share/nginx/html/fixtures/media/;
        add_header Access-Control-Allow-Origin *;
    }
}
