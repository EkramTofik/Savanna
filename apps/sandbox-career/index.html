<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Savanna Career Gateway — sandbox</title>
    <style>
      body {
        margin: 0;
        font:
          1.125rem/1.5 "Segoe UI",
          system-ui,
          sans-serif;
        color: #111;
        background: #f7f7f7;
      }
      header,
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 1rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      button {
        min-height: 44px;
        min-width: 44px;
        font: inherit;
        margin-right: 0.5rem;
      }
      savanna-job-card,
      savanna-credential {
        display: block;
        margin: 1rem 0;
      }
      :focus-visible {
        outline: 3px solid #0b5cab;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Career Gateway sandbox</h1>
      <p>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="am">አማርኛ</button>
      </p>
    </header>
    <main>
      <h2>Job</h2>
      <savanna-job-card
        job="J-9"
        api="http://localhost:4020"
        api-key="pk_live_demo"
        lang="en"
      ></savanna-job-card>
      <h2>Certificate</h2>
      <savanna-credential
        id="C-7"
        api="http://localhost:4020"
        api-key="pk_live_demo"
        lang="en"
      ></savanna-credential>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
